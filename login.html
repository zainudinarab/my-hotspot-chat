<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WiFi Login</title>
    <link href="public/css/tailwind.css" rel="stylesheet">
    <link rel="stylesheet" href="public/libs/fontawesome/css/all.min.css">
    
    <style>
    /* 1. JENDELA CHAT */
    #chat-window {
        display: none;
        position: fixed;
        bottom: 80px; /* Jarak dari bawah di desktop */
        right: 20px;
        width: 370px;
        height: 550px;
        z-index: 1000;
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 20px 50px rgba(0,0,0,0.15);
        background: white;
        border: 1px solid #e2e8f0;
        transition: all 0.3s ease;
    }

    /* 2. MODE MOBILE (Full Screen) */
    @media (max-width: 640px) {
        #chat-window {
            bottom: 0 !important;
            right: 0 !important;
            width: 100% !important;
            height: 100% !important;
            border-radius: 0 !important;
        }
    }

    /* 3. TOMBOL FAB LEBIH BERSIH & KECIL */
    .fab {
        position: fixed;
        bottom: 20px;
        right: 20px;
        width: 50px; /* Ukuran lebih kecil */
        height: 50px;
        background: #2563eb;
        color: white;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        cursor: pointer;
        z-index: 1001;
        box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        transition: all 0.2s ease;
    }

    .fab:hover { transform: scale(1.1); }
    
    /* Indikator Pesan (Opsional) */
    .fab::after {
        content: '';
        position: absolute;
        top: 0;
        right: 0;
        width: 12px;
        height: 12px;
        background: #ef4444;
        border: 2px solid white;
        border-radius: 50%;
        display: none; /* munculkan jika ada pesan */
    }
</style>

<body class="bg-slate-100 flex items-center justify-center min-h-screen">
    
    <div id="chat-window">
        <iframe src="https://api.griyaasumta.my.id?view=mobile" id="chat-iframe" style="width:100%; height:100%; border:none;"></iframe>
    </div>

    <div class="fab" id="fab-btn" onclick="toggleChat()">
        <i class="fas fa-comment-alt" id="chat-icon"></i>
    </div>

    <script>
        function toggleChat() {
            var chat = document.getElementById('chat-window');
            var fab = document.getElementById('fab-btn');
            
            if (chat.style.display === 'none' || chat.style.display === '') {
                chat.style.display = 'block';
                fab.style.display = 'none'; // Sembunyikan FAB saat chat terbuka
            } else {
                chat.style.display = 'none';
                fab.style.display = 'flex';
            }
        }

        // Mendengarkan pesan dari iframe (untuk tombol close di dalam header chat)
        window.addEventListener('message', function(event) {
            if (event.data === 'closeChat') {
                toggleChat();
            }
        });
    </script>
</body>
</html>
